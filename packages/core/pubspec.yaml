name: arkie_core
description: Arkie's shared data, domain, and dependency injection layer.
version: 0.1.0
repository: https://github.com/elyon-labs/arkie
publish_to: none

environment:
  sdk: '>=3.9.0 <4.0.0'

resolution: workspace

dependencies:
  collection: ^1.19.1
  cs2_rcon_client:
    path: ../client
  dart_foundation:
    git:
      url: https://github.com/elyon-labs/dart-foundation.git
      ref: main
  dart_mappable: ^4.2.2
  flutter:
    sdk: flutter
  fuzzywuzzy: ^1.2.0
  get_it: ^9.0.5
  hive_ce: ^2.15.1
  hive_ce_flutter: ^2.3.3
  oxidized: ^6.2.0
  package_info_plus: ^9.0.0
  rx_shared_preferences: ^4.0.0
  rxdart: ^0.28.0
  uuid: ^4.5.2

dev_dependencies:
  build_runner: ^2.4.11
  dart_mappable_builder: ^4.2.3
  flutter_test:
    sdk: flutter
  hive_ce_generator: ^1.9.3

flutter:
  assets:
    - assets/maps/
