name: arkie_state
description: Arkie's shared presentation state (cubits and their states) used by the desktop and mobile apps.
version: 0.1.0
repository: https://github.com/elyon-labs/arkie
publish_to: none

environment:
  sdk: '>=3.9.0 <4.0.0'

resolution: workspace

dependencies:
  arkie_core:
    path: ../core
  cs2_rcon_client:
    path: ../client
  dart_foundation:
    git:
      url: https://github.com/elyon-labs/dart-foundation.git
      ref: main
  dart_mappable: ^4.2.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  oxidized: ^6.2.0
  rxdart: ^0.28.0
  uuid: ^4.5.2

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.4.11
  dart_mappable_builder: ^4.2.3
  flutter_test:
    sdk: flutter
