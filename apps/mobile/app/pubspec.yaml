name: arkie_mobile
description: "Arkie's mobile RCON console."
publish_to: 'none'
version: 0.1.0

resolution: workspace

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  cs2_rcon_client:
    path: ../../../packages/client
  cs2_rcon_front_end:
    path: ../../front_end
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_hooks: ^0.20.5
  hive_ce_flutter: ^2.3.3
  oxidized: ^6.2.0
  package_info_plus: ^9.0.0
  rx_shared_preferences: ^4.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - shorebird.yaml
