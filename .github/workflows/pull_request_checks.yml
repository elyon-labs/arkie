name: Pull Request Checks

on:
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.dart"
      - "**/pubspec.yaml"
      - "**/pubspec.lock"
      - "melos.yaml"
      - ".github/workflows/pull_request_checks.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.35.7"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Flutter
        uses: subosito/flutter-action@v2.19.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install melos
        run: dart pub global activate melos

      - name: Install dependencies
        run: melos bootstrap

      - name: Verify Flutter formatting
        run: melos run format:flutter:ci

      - name: Verify Dart formatting
        run: melos run format:dart:ci

      - name: Analyze Flutter project source
        run: melos run analyze:flutter:ci

      - name: Analyze Dart project source
        run: melos run analyze:dart:ci

      - name: Run Flutter tests
        run: melos run test:flutter:ci

      - name: Run Dart tests
        run: melos run test:dart:ci
