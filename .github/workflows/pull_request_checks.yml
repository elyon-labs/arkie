name: Pull Request Checks

on:
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.dart"
      - "**/pubspec.yaml"
      - "**/pubspec.lock"
      - ".github/workflows/pull_request_checks.yml"

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter and Dart checks
    uses: elyon-labs/workflows/.github/workflows/validate-flutter-melos.yml@381588c0b1a8e3ae15d52230a20fdd88ef584f1c # v1.0.0
    with:
      flutter-version: "3.47.8"
      melos-version: "8.0.0"
    permissions:
      contents: read
