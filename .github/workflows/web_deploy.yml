name: Web Deploy

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/web_deploy.yml"
  # The release notes and the download links are built from the releases
  # themselves, so a release has to redeploy the site although it touches no
  # file the paths above match. Both ways the notes change are covered: the
  # release workflow publishing one, and a body edited by hand afterwards.
  release:
    types:
      - published
      - edited
      - deleted
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22.23.2"

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      # A release event points at the tag, so an unqualified checkout would
      # deploy the site as it stood when that tag was cut and silently undo
      # anything merged since. The deployed site is always the default branch.
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck site
        run: pnpm web:typecheck

      # The releases come from the GitHub API during the build. The repository
      # is public, so this is only to lift the rate limit CI runners share.
      - name: Build site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm web:build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          packageManager: pnpm
          command: deploy
