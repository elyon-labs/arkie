name: Web Checks

on:
  pull_request:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/web_checks.yml"

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    uses: elyon-labs/workflows/.github/workflows/validate-web.yml@381588c0b1a8e3ae15d52230a20fdd88ef584f1c # v1.0.0
    with:
      node-version: "22.23.2"
    permissions:
      contents: read
